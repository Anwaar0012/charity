name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A52C46: ${{ secrets.A52C46 }}
          BCE663: ${{ secrets.BCE663 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A52C46', '')
          k2 = os.environ.get('BCE663', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- c5044d49cd8778c54a15 -->', k1) if k1 else txt
          out = out.replace('<!-- d743c1005f9bd8731e2a8f3c9a55 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
